<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark space background — keeps the icon legible on light browser chrome -->
  <circle cx="16" cy="16" r="15.5" fill="#040a14"/>
  <!-- Subtle nebula tint -->
  <circle cx="16" cy="16" r="15.5" fill="url(#nebula)" opacity="0.45"/>

  <!-- Nacelle warp glow (drawn first so the nacelles sit on top) -->
  <ellipse cx="6" cy="14.5" rx="3" ry="1.4" fill="#3366ff" opacity="0.55"/>
  <ellipse cx="26" cy="14.5" rx="3" ry="1.4" fill="#3366ff" opacity="0.55"/>

  <!-- Nacelles — cyan warp pods -->
  <rect x="2.5" y="12" width="8" height="3" rx="1.5" fill="#0cc"/>
  <rect x="21.5" y="12" width="8" height="3" rx="1.5" fill="#0cc"/>
  <!-- Bussard collectors (front of nacelles) -->
  <circle cx="9.5" cy="13.5" r="1.1" fill="#ffdd66"/>
  <circle cx="22.5" cy="13.5" r="1.1" fill="#ffdd66"/>

  <!-- Pylons connecting nacelles to hull -->
  <path d="M10.5 14 L14 15.5 L14 13 Z" fill="#3a4a5a"/>
  <path d="M21.5 14 L18 15.5 L18 13 Z" fill="#3a4a5a"/>

  <!-- Engineering hull -->
  <rect x="13.5" y="14" width="5" height="9" rx="1.4" fill="#1a3a55"/>
  <!-- Deflector dish -->
  <circle cx="16" cy="22" r="1.4" fill="#ffaa44"/>

  <!-- Saucer section (top-down disc) -->
  <ellipse cx="16" cy="10.5" rx="7" ry="3.2" fill="#0cc"/>
  <ellipse cx="16" cy="10.5" rx="5" ry="1.8" fill="#aaeeff"/>
  <!-- Bridge dot -->
  <circle cx="16" cy="10.5" r="1.2" fill="#fff"/>

  <!-- Engine impulse glow at the rear -->
  <ellipse cx="16" cy="24.2" rx="2.2" ry="0.9" fill="#88ccff" opacity="0.85"/>
  <ellipse cx="16" cy="24.4" rx="1.2" ry="0.5" fill="#fff" opacity="0.8"/>

  <defs>
    <radialGradient id="nebula" cx="0.3" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#143a55"/>
      <stop offset="1" stop-color="#040a14" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
