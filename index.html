  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 16px;
      background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
      font-family: 'Courier New', monospace; color: #0f0; font-size: 12px;
      pointer-events: none; z-index: 10;
    }
    #hud .faction { color: #0ff; font-weight: bold; }
    #hud .shields { color: #ff0; }
    #hud .energy { color: #0f0; }
    #controls {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      font-family: 'Courier New', monospace; color: #555; font-size: 11px;
      text-align: center; pointer-events: none; z-index: 10;
    }
    @media (max-width: 600px) {
      #hud { font-size: 9px; padding: 4px 8px; }
      #controls { font-size: 8px; bottom: 8px; }
    }
    @media (max-height: 500px) {
      #hud { display: none; }
      #controls { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="hud">
    <span class="faction" id="hud-faction">FEDERATION</span>
    <span class="shields" id="hud-shields">SHD: 100</span>
    <span class="energy" id="hud-energy">NRG: 10000</span>
    <span id="hud-speed">SPD: 0</span>
  </div>
  <canvas id="game"></canvas>
  <div id="controls">
    WASD: move | Space: torpedo | F: phaser | C: cloak | Tab: map/scores | B: bomb | V: beam down | G: beam up
  </div>
